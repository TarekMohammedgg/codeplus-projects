name: doctor_hunt
description: "Doctor Hunt Healthcare & Medical Appointment Flutter Application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  pinput: ^6.0.2
  smooth_page_indicator: ^2.0.1
  go_router: ^17.5.0
  slang: ^4.19.0
  slang_flutter: ^4.19.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  intl: ^0.20.2
  easy_date_timeline: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  go_router_builder: ^4.4.0
  slang_build_runner: ^4.19.0
  flutter_native_splash: ^2.4.8
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/design/
    - assets/dummy/
    - assets/dummy/doctors/

flutter_assets:
  assets_path: assets/
  output_path: lib/generated/
  filename: app_image.dart
  ignore_comments: true

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  background_image: assets/design/splash_background.png
  background_image_dark: assets/design/splash_background.png
  image: assets/design/splash_logo.png
  image_dark: assets/design/splash_logo.png
  android_gravity: center
  ios_content_mode: center
  web_image_mode: contain
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/design/splash_logo_android12.png
    image_dark: assets/design/splash_logo_android12.png
